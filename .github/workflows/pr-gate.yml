name: PR Quality Gate

# Dogfood: this repo gates its own PRs through the same reusable workflow
# external users consume — reviewing the public gdquest game demo with the
# PR's own agent code.

on:
  pull_request:

jobs:
  gate:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/godot-review.yml
    with:
      game-repository: gdquest-demos/godot-2d-space-game
      project-path: project
      scope: full
      agent-repository: ${{ github.repository }}
      agent-ref: ${{ github.head_ref || github.ref }}
    secrets:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
